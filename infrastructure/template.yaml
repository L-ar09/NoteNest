AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NoteNest authenticated notes API

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        NOTES_TABLE_NAME: !Ref NotesTable
        CORS_ORIGIN: http://localhost:5173

Parameters:
  ProjectName:
    Type: String
    Default: notenest
    AllowedPattern: '^[a-z0-9-]+$'
    Description: Lowercase name used to label NoteNest resources.

Resources:
  NotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-notes'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: NoteNest

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-users'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 3
      MfaConfiguration: 'OFF'
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Application: NoteNest

  WebAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-web'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  NotesApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowOrigins:
          - http://localhost:5173
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              Audience:
                - !Ref WebAppClient
              Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'

  ListNotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-list-notes'
      CodeUri: ../backend
      Handler: src/handlers.listNotes
      Policies:
        - Statement:
            Effect: Allow
            Action: dynamodb:Query
            Resource: !GetAtt NotesTable.Arn
      Events:
        ListNotes:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /notes
            Method: GET

  CreateNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-create-note'
      CodeUri: ../backend
      Handler: src/handlers.createNote
      Policies:
        - Statement:
            Effect: Allow
            Action: dynamodb:PutItem
            Resource: !GetAtt NotesTable.Arn
      Events:
        CreateNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /notes
            Method: POST

  GetNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-get-note'
      CodeUri: ../backend
      Handler: src/handlers.getNote
      Policies:
        - Statement:
            Effect: Allow
            Action: dynamodb:GetItem
            Resource: !GetAtt NotesTable.Arn
      Events:
        GetNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /notes/{noteId}
            Method: GET

  UpdateNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-update-note'
      CodeUri: ../backend
      Handler: src/handlers.updateNote
      Policies:
        - Statement:
            Effect: Allow
            Action: dynamodb:UpdateItem
            Resource: !GetAtt NotesTable.Arn
      Events:
        UpdateNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /notes/{noteId}
            Method: PUT

  DeleteNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-delete-note'
      CodeUri: ../backend
      Handler: src/handlers.deleteNote
      Policies:
        - Statement:
            Effect: Allow
            Action: dynamodb:DeleteItem
            Resource: !GetAtt NotesTable.Arn
      Events:
        DeleteNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /notes/{noteId}
            Method: DELETE

Outputs:
  NotesTableName:
    Description: DynamoDB table for authenticated users' notes.
    Value: !Ref NotesTable
  UserPoolId:
    Description: Cognito user pool ID.
    Value: !Ref UserPool
  WebAppClientId:
    Description: Public app client ID for the React application.
    Value: !Ref WebAppClient
  NotesApiUrl:
    Description: Authenticated NoteNest HTTP API base URL.
    Value: !Sub 'https://${NotesApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/'
